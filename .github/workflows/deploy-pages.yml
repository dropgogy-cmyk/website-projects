name: Deploy website demos

on:
  push:
    branches: [main]
    paths:
      - "demos/barber-noir/**"
      - "demos/grillbar163/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Prepare site artifact
        run: |
          mkdir -p _site/demos/barber-noir _site/demos/grillbar163
          cp demos/barber-noir/index.html _site/index.html
          cp demos/barber-noir/index.html _site/demos/barber-noir/index.html
          cp demos/barber-noir/README.md _site/demos/barber-noir/README.md
          cp demos/grillbar163/index.html _site/demos/grillbar163/index.html
          cp demos/grillbar163/README.md _site/demos/grillbar163/README.md
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
